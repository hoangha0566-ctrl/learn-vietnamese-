function closeSheet() {
  const sh = $("#sheet");
  if (!sh) return;
  sh.classList.remove("open");
  sh.hidden = true;
  if (selEl) { selEl.classList.remove("sel"); selEl = null; }
  document.querySelectorAll(".phr.sel").forEach(function (e) { e.classList.remove("sel"); });
}

/* ===== THỬ THÁCH ===== */
let Q = null;
function buildQuiz(items, n, allowFill) {
  const pool = shuffle(items.slice()).slice(0, Math.min(n, items.length));
  const types = allowFill ? ["en2vi", "fill", "vi2en"] : ["en2vi", "vi2en"];
  const qs = pool.map(function (it, i) {
    let t = types[i % types.length];
    if (t === "fill" && (!it.ex || it.ex.toLowerCase().indexOf(it.f.toLowerCase()) < 0)) t = "en2vi";
    const others = shuffle(items.filter(function (o) { return o !== it && o.vi !== it.vi && o.w !== it.w && o.f !== it.f; })).slice(0, 3);
    let opts, correct;
    if (t === "en2vi") { opts = [it].concat(others).map(function (o) { return o.vi; }); correct = it.vi; }
    else if (t === "vi2en") { opts = [it].concat(others).map(function (o) { return o.w; }); correct = it.w; }
    else { opts = [it].concat(others).map(function (o) { return o.f; }); correct = it.f; }
    return { t: t, it: it, opts: shuffle(opts), correct: correct };
  });
  return shuffle(qs);
}

function startQuiz(source) {
  stopSpeak(); closeSheet(); closeModal();
  let items, title;
  if (source === "saved") {
    items = Object.keys(S.saved).map(function (k) { const s = S.saved[k]; return { w: s.w, f: s.w, p: s.p, vi: s.m, ex: s.ex || "" }; });
    title = "Ôn sổ từ";
    if (items.length < 4) { toast("Cần lưu ít nhất 4 từ để ôn"); return; }
    Q = { source: source, title: title, qs: buildQuiz(items, 12, false) };
  } else {
    const p = partById(source);
    items = vocabItems(source);
    title = "Thử thách · " + p.label;
    Q = { source: source, title: title, qs: buildQuiz(items, 12, true) };
  }
  Q.i = 0; Q.score = 0; Q.right = 0; Q.streak = 0; Q.bestStreak = 0; Q.wrong = []; Q.answered = false;
  renderQuiz();
}

function blankSentence(ex, f) {
  const re = new RegExp("\\b" + f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i");
  const parts = ex.split(re);
  if (parts.length < 2) return esc(ex);
  return esc(parts[0]) + '<span class="blank">______</span>' + esc(parts.slice(1).join(f));
}
function hiSentence(ex, f) {
  const re = new RegExp("\\b(" + f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")\\b", "i");
  return esc(ex).replace(re, "<mark>$1</mark>");
}

function renderQuiz() {
  const q = Q.qs[Q.i];
  const total = Q.qs.length;
  let prompt = "";
  if (q.t === "en2vi") {
    prompt = '<p class="q-kind">Từ này nghĩa là gì?</p><div class="q-word">' + esc(q.it.w) + ' <button class="tool icon" data-speak="' + esc(q.it.w) + '" aria-label="Nghe">' + ICON.play + '</button></div><p class="q-pos">' + (POS[q.it.p] || "") + '</p>';
  } else if (q.t === "vi2en") {
    prompt = '<p class="q-kind">Chọn từ tiếng Anh đúng nghĩa</p><div class="q-word vi" lang="vi">' + esc(q.it.vi) + '</div><p class="q-pos">' + (POS[q.it.p] || "") + '</p>';
  } else {
    prompt = '<p class="q-kind">Điền từ còn thiếu vào câu trong truyện</p><blockquote class="q-sent">' + blankSentence(q.it.ex, q.it.f) + '</blockquote>';
  }
  const html = '<div class="rbar"><div class="rbar-in">' +
      '<button class="tool icon" data-home="1" aria-label="Thoát">' + ICON.back + '</button>' +
      '<div class="rbar-title"><b>' + esc(Q.title) + '</b><span>Câu ' + (Q.i + 1) + ' / ' + total + '</span></div>' +
      '<div class="q-score">' + soundBtn() + '<span class="streak' + (Q.streak >= 3 ? " hot" : "") + '">' + ICON.flame + Q.streak + '</span><b>' + Q.score + '</b><small>điểm</small></div>' +
    '</div><div class="bar thin"><i style="width:' + (Q.i / total * 100) + '%"></i></div></div>' +
    '<div class="wrap quiz">' +
      '<section class="q-card">' + prompt + '</section>' +
      '<div class="opts' + (q.t === "en2vi" ? " vi-opts" : "") + '">' + q.opts.map(function (o, oi) {
        return '<button class="opt" data-opt="' + oi + '"><kbd>' + (oi + 1) + '</kbd><span' + (q.t === "en2vi" ? ' lang="vi"' : "") + '>' + esc(o) + '</span></button>';
      }).join("") + '</div>' +
      '<div id="feedback" class="feedback" hidden></div>' +
    '</div>';
  Q.answered = false;
  view.innerHTML = html;
  window.scrollTo(0, 0);
}

function answer(oi) {
  if (!Q || Q.answered) return;
  Q.answered = true;
  const q = Q.qs[Q.i];
  const chosen = q.opts[oi];
  const ok = chosen === q.correct;
  document.querySelectorAll(".opt").forEach(function (b, bi) {
    b.disabled = true;
    if (q.opts[bi] === q.correct) b.classList.add("right");
    else if (bi === oi) b.classList.add("wrong");
  });
  if (ok) {
    Q.streak++; Q.right++;
    Q.bestStreak = Math.max(Q.bestStreak, Q.streak);
    Q.score += 10 + (Q.streak >= 3 ? 5 : 0);
  } else {
    Q.streak = 0;
    Q.wrong.push(q.it);
  }
  beep(ok);
  const fb = $("#feedback");
  const praise = ["Chính xác!", "Tuyệt!", "Thám tử giỏi!", "Đúng rồi!"];
  fb.className = "feedback " + (ok ? "good" : "bad");
  fb.innerHTML = '<p class="fb-title">' + (ok ? praise[Math.floor(Math.random() * praise.length)] + (Q.streak >= 3 ? " · chuỗi " + Q.streak + " (+5)" : "") : "Chưa đúng. Đáp án là <b>" + esc(q.correct) + "</b>") + '</p>' +
    '<p class="fb-word"><b>' + esc(q.it.w) + '</b> <span class="pos">' + (POS[q.it.p] || "") + '</span> ' + esc(q.it.vi) + '</p>' +
    (q.it.ex ? '<p class="fb-ex">“' + hiSentence(q.it.ex, q.it.f) + '”</p>' : "") +
    '<button class="btn primary" data-qnext="1">' + (Q.i === Q.qs.length - 1 ? "Xem kết quả" : "Câu tiếp") + ' ' + ICON.next + '</button>';
  fb.hidden = false;
  fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function nextQ() {
  if (Q.i < Q.qs.length - 1) { Q.i++; renderQuiz(); }
  else renderResult();
}

function renderResult() {
  const total = Q.qs.length;
  const pct = Math.round(Q.right / total * 100);
  const stars = pct >= 90 ? 3 : pct >= 70 ? 2 : pct >= 40 ? 1 : 0;
  let isBest = false;
  if (Q.source !== "saved") {
    if (S.best[Q.source] == null || pct > S.best[Q.source]) { S.best[Q.source] = pct; isBest = true; save(); }
  }
  const msg = stars === 3 ? "Vụ án đã được phá! Vốn từ của bạn thật sắc bén." :
              stars === 2 ? "Rất tốt. Còn vài manh mối nhỏ cần xem lại." :
              stars === 1 ? "Khởi đầu ổn. Đọc lại các cảnh và thử lần nữa nhé." :
              "Đừng nản. Mở bản dịch, đọc lại rồi quay lại thử thách.";
  let html = '<div class="wrap result">' +
    '<section class="res-card">' +
      '<div class="res-stars" aria-label="' + stars + ' trên 3 sao">' + [0, 1, 2].map(function (i) { return '<span class="st' + (i < stars ? " on" : "") + '" style="--d:' + (i * 0.15) + 's">' + ICON.star + '</span>'; }).join("") + '</div>' +
      '<h2>' + pct + '% đúng</h2>' +
      '<p class="res-sub">' + Q.right + '/' + total + ' câu · ' + Q.score + ' điểm · chuỗi dài nhất ' + Q.bestStreak + (isBest ? ' · <b class="ok-text">kỷ lục mới</b>' : "") + '</p>' +
      '<p>' + msg + '</p>' +
      '<div class="modal-actions">' +
        '<button class="btn primary" data-quiz="' + Q.source + '">Chơi lại</button>' +
        (Q.source !== "saved" ? '<button class="btn" data-go="' + Q.source + '" data-mode="scene" data-scene="0">Đọc lại</button>' : '<button class="btn" data-notebook="1">Về sổ từ</button>') +
        '<button class="btn ghost" data-home="1">Về hồ sơ</button>' +
      '</div>' +
    '</section>';
  if (Q.wrong.length) {
    html += '<section class="review"><div class="review-head"><h3>Từ cần ôn lại</h3><button class="tool" data-save-wrong="1">' + ICON.star + '<span>Lưu tất cả vào sổ</span></button></div><ul>' +
      Q.wrong.map(function (it) {
        return '<li><div><b>' + esc(it.w) + '</b> <span class="pos">' + (POS[it.p] || "") + '</span> <span lang="vi">' + esc(it.vi) + '</span></div>' + (it.ex ? '<p class="fb-ex">“' + hiSentence(it.ex, it.f) + '”</p>' : "") + '</li>';
      }).join("") + '</ul></section>';
  }
  html += '</div>';
  view.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ===== SỔ TỪ ===== */
function renderNotebook() {
  stopSpeak(); closeSheet();
  const keys = Object.keys(S.saved).sort();
  let html = '<div class="rbar"><div class="rbar-in"><button class="tool icon" data-home="1" aria-label="Về hồ sơ">' + ICON.back + '</button>' +
    '<div class="rbar-title"><b>Sổ từ vựng</b><span>' + keys.length + ' mục đã lưu</span></div>' +
    (keys.length >= 4 ? '<button class="btn primary small" data-quiz="saved">Ôn sổ từ</button>' : "") +
    '</div></div><div class="wrap notebook">';
  if (!keys.length) {
    html += '<section class="empty"><div class="empty-jar">' + jarSVG(0, 90) + '</div><h2>Sổ còn trống</h2><p>Khi đọc truyện, chạm vào một từ và bấm <b>Lưu vào sổ</b>. Các từ sẽ hiện ở đây để bạn ôn lại. Lưu từ 4 từ trở lên là có thể làm thử thách riêng.</p><button class="btn primary" data-go="p1" data-mode="scene">Bắt đầu đọc</button></section>';
  } else {
    html += '<ul class="nb-list">' + keys.map(function (k) {
      const s = S.saved[k];
      return '<li><div class="nb-main"><b>' + esc(s.w) + '</b> <span class="pos">' + (POS[s.p] || s.p) + '</span><p lang="vi">' + esc(s.m) + '</p>' + (s.ex ? '<p class="fb-ex">“' + hiSentence(s.ex, s.f || s.w) + '”</p>' : "") + '</div>' +
        '<div class="nb-act"><button class="tool icon" data-speak="' + esc(s.w) + '" aria-label="Nghe">' + ICON.play + '</button><button class="tool icon" data-unsave="' + esc(k) + '" aria-label="Xóa khỏi sổ">×</button></div></li>';
    }).join("") + '</ul>';
    if (keys.length < 4) html += '<p class="muted center">Lưu thêm ' + (4 - keys.length) + ' từ nữa để mở khóa thử thách ôn sổ từ.</p>';
  }
  html += '</div>';
  view.innerHTML = html;
  window.scrollTo(0, 0);
}

function findSentence(word) {
  for (const p of PARTS) for (const s of p.scenes) for (const pp of s.p) {
    const sentences = pp[0].match(/[^.!?]+[.!?]+["']?/g) || [pp[0]];
    for (const se of sentences) if (new RegExp("\\b" + word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i").test(se)) return se.trim().replace(/^["']\s*/, "");
  }
  return "";
}

/* ===== HỘP THOẠI ===== */
function showModal(inner) {
  const m = $("#modal");
  $("#modal-body").innerHTML = inner;
  m.hidden = false;
}
function closeModal() { const m = $("#modal"); if (m) m.hidden = true; }

/* ===== SỰ KIỆN ===== */
document.addEventListener("click", function (e) {
  const t = e.target.closest("button, .w, [data-close]");
  if (!t) {
    if (!e.target.closest("#sheet")) closeSheet();
    return;
  }
  const d = t.dataset;
  if (t.classList.contains("w")) { openSheet(t); return; }
  if (d.close) { closeSheet(); return; }
  if (d.home) { closeModal(); renderHome(); return; }
  if (d.notebook) { closeModal(); renderNotebook(); return; }
  if (d.go) { closeModal(); openReader(d.go, d.mode || "scene", d.scene != null ? +d.scene : null); return; }
  if (d.quiz) { startQuiz(d.quiz); return; }
  if (d.modeSet) { R.mode = d.modeSet; S.mode = R.mode; save(); stopSpeak(); renderReader(); return; }
  if (d.viAll) {
    S.showVi = !S.showVi; R.vi = {}; save();
    document.querySelectorAll(".scene").forEach(function (sc) {
      sc.classList.toggle("vi-on", S.showVi);
      const b = sc.querySelector(".vi-btn"); b.classList.toggle("on", S.showVi); b.setAttribute("aria-pressed", S.showVi); b.lastChild.textContent = S.showVi ? "Ẩn bản dịch" : "Dịch tiếng Việt";
    });
    t.classList.toggle("on", S.showVi); t.setAttribute("aria-pressed", S.showVi);
    return;
  }
  if (d.vi != null) {
    const si = +d.vi;
    const sc = t.closest(".scene");
    const on = !sc.classList.contains("vi-on");
    R.vi[si] = on;
    sc.classList.toggle("vi-on", on);
    t.classList.toggle("on", on); t.setAttribute("aria-pressed", on);
    t.lastChild.textContent = on ? "Ẩn bản dịch" : "Dịch tiếng Việt";
    return;
  }
  if (d.font) {
    S.font = Math.max(15, Math.min(28, S.font + (+d.font) * 1.5)); save();
    const rd = $(".reader"); if (rd) rd.style.setProperty("--read-size", S.font + "px");
    return;
  }
  if (d.say != null) {
    const s = partById(R.pid).scenes[+d.say];
    speak(s.p.map(function (pp) { return pp[0]; }).join(" "), t);
    return;
  }
  if (d.speak) { speak(d.speak); return; }
  if (d.jump != null) { stopSpeak(); R.idx = +d.jump; renderReader(); return; }
  if (d.prev) { stopSpeak(); if (R.idx > 0) { R.idx--; renderReader(); } return; }
  if (d.next) { stopSpeak(); markRead(R.pid, R.idx); R.idx++; renderReader(); return; }
  if (d.finish) { stopSpeak(); markRead(R.pid, R.idx); finishPart(R.pid); return; }
  if (d.finishAll) { stopSpeak(); finishPart(R.pid); return; }
  if (d.save) {
    const k = d.save;
    if (S.saved[k]) { delete S.saved[k]; toast("Đã bỏ khỏi sổ"); }
    else {
      const r = DICT[k];
      const kv = findVocab(k);
      S.saved[k] = { w: k, f: d.form || k, p: r ? r.p : "", m: kv ? kv.vi : (r ? r.m : ""), ex: kv ? kv.ex : findSentence(d.form || k) };
      toast("Đã lưu “" + k + "” vào sổ");
    }
    save();
    if (selEl) openSheet(selEl);
    return;
  }
  if (d.savePh) {
    const k = d.savePh;
    if (S.saved[k]) { delete S.saved[k]; toast("Đã bỏ khỏi sổ"); }
    else { S.saved[k] = { w: k, f: k, p: "phr", m: PHRASES[k], ex: findSentence(k) }; toast("Đã lưu cụm từ vào sổ"); }
    save();
    if (selEl) openSheet(selEl);
    return;
  }
  if (d.unsave) { delete S.saved[d.unsave]; save(); renderNotebook(); return; }
  if (d.opt != null) { answer(+d.opt); return; }
  if (d.qnext) { nextQ(); return; }
  if (d.saveWrong) {
    Q.wrong.forEach(function (it) { S.saved[it.w] = { w: it.w, f: it.f, p: it.p, m: it.vi, ex: it.ex }; });
    save(); toast("Đã lưu " + Q.wrong.length + " từ vào sổ");
    t.disabled = true;
    return;
  }
  if (d.sound) { S.sound = !S.sound; save(); t.classList.toggle("on", S.sound); t.setAttribute("aria-pressed", S.sound); toast(S.sound ? "Đã bật âm thanh" : "Đã tắt âm thanh"); return; }
});

document.addEventListener("keydown", function (e) {
  const a = document.activeElement;
  if ((e.key === "Enter" || e.key === " ") && a && a.classList && a.classList.contains("w")) { e.preventDefault(); openSheet(a); return; }
  if (e.key === "Escape") { closeSheet(); closeModal(); return; }
  if (Q && $(".quiz")) {
    if (!Q.answered && /^[1-4]$/.test(e.key)) { answer(+e.key - 1); return; }
    if (Q.answered && e.key === "Enter") { e.preventDefault(); nextQ(); return; }
  }
  if ($(".reader") && R.mode === "scene" && !$("#modal:not([hidden])")) {
    if (e.key === "ArrowRight") { const b = $("[data-next]") || $("[data-finish]"); if (b) b.click(); }
    if (e.key === "ArrowLeft") { const b = $("[data-prev]"); if (b && !b.disabled) b.click(); }
  }
});

$("#modal").addEventListener("click", function (e) { if (e.target.id === "modal") closeModal(); });
try { if ("speechSynthesis" in window) speechSynthesis.getVoices(); } catch (e) {}

let G = null;
function gameSave() { S.game = S.game || {}; save(); }
function chDone(id) { return S.game && S.game[id]; }
function chUnlocked(i) { return i === 0 || chDone(CHAPTERS[i - 1].id); }

        '<span class="chap-num">' + (i + 1) + '</span>' +

function startChapter(i) {
  const c = CHAPTERS[i];
  G = { ci: i, ni: 0, hearts: 3, clues: 0, bg: "golf", cast: [], faces: {}, dark: false, solved: {}, mistakes: 0 };
  stepNode(true);
}

function stepNode(first) {
  const c = CHAPTERS[G.ci];
  const nd = c.nodes[G.ni];
  if (nd.bg) G.bg = nd.bg;
  if (nd.cast) G.cast = nd.cast.slice();
  if (nd.bg && nd.bg !== "night") G.dark = false;
  if (nd.who && nd.who !== "n" && nd.f) G.faces[nd.who] = nd.f;
  if (nd.who && nd.who !== "n" && G.cast.indexOf(nd.who) < 0 && nd.act !== "find") G.cast.push(nd.who);
  G.answered = false;
  renderGame();
  if (nd.fx === "flash") { const st = $(".stage"); if (st) { st.classList.remove("flash"); void st.offsetWidth; st.classList.add("flash"); } beep(false); }
}

function clockSVG(h, m) {
  const ma = m * 6, ha = (h % 12) * 30 + m * 0.5;
  let ticks = "";
  for (let k = 0; k < 12; k++) ticks += '<path d="M50 8 v' + (k % 3 ? 5 : 9) + '" transform="rotate(' + k * 30 + ' 50 50)" stroke="currentColor" stroke-width="' + (k % 3 ? 1.6 : 3) + '"/>';
  return '<svg viewBox="0 0 100 100" class="clock" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="var(--paper)" stroke="currentColor" stroke-width="3"/>' + ticks +
    '<path d="M50 50 L50 26" transform="rotate(' + ha + ' 50 50)" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>' +
    '<path d="M50 50 L50 14" transform="rotate(' + ma + ' 50 50)" stroke="var(--pansy)" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3.5" fill="currentColor"/></svg>';
}

function renderGame() {

  const speaker = nd.who || "n";
  const castHtml = G.cast.map(function (w, k) {
    const n = G.cast.length;
    const left = n === 1 ? 50 : n === 2 ? (k ? 74 : 26) : [17, 50, 83][k];
    const active = speaker === w;
    return '<div class="actor' + (active ? " talk" : "") + (w === "lady" ? " ghost" : "") + '" style="left:' + left + '%">' + portrait(w, G.faces[w] || "neutral") + '</div>';
  }).join("");
  let spots = "";
  if (nd.act === "find") spots = nd.spots.map(function (s, k) { return '<button class="spot' + (G.solved[k] ? " seen" : "") + '" data-gspot="' + k + '" style="left:' + s.x + '%;top:' + s.y + '%;width:' + s.w + '%;height:' + s.h + '%" aria-label="Chỗ ' + (k + 1) + '"></button>'; }).join("");
  if (nd.act === "lamp" && !G.dark) spots = '<button class="spot lampspot" data-glamp="1" style="left:40%;top:2%;width:20%;height:24%" aria-label="Tắt đèn"></button>';

  const name = CAST[speaker];
  let box = '<div class="dlg' + (speaker === "n" ? " narr" : "") + '">' +
    '<div class="dlg-head"><span class="who" style="--who:' + name.color + '">' + name.name + '</span>' +
    (nd.kind ? '<span class="pos keytag">' + nd.kind + '</span>' : "") + '</div>' +
    '<p class="en dlg-en">' + renderPara(nd.en, c.p) + '</p>' +
    '<p class="vi dlg-vi" lang="vi"' + (S.gameVi ? "" : " hidden") + '>' + esc(nd.vi) + '</p>';

  if (nd.q) {
    box += '<div class="gopts">' + nd.opts.map(function (o, k) { return '<button class="opt" data-gopt="' + k + '"><kbd>' + (k + 1) + '</kbd><span lang="vi">' + esc(o[0]) + '</span></button>'; }).join("") + '</div><div id="gfb" class="feedback" hidden></div>';
  } else if (nd.act === "clock") {
    box += '<div class="clocks">' + nd.times.map(function (t, k) { return '<button class="clockbtn" data-gclock="' + k + '" aria-label="Đồng hồ ' + (k + 1) + '">' + clockSVG(t[0], t[1]) + '</button>'; }).join("") + '</div><div id="gfb" class="feedback" hidden></div>';
  } else if (nd.act === "jars") {
    box += '<div class="clocks">' + [0, 1, 2, 3].map(function (k) { return '<button class="clockbtn" data-gjar="' + k + '" aria-label="Bình ' + (k + 1) + '">' + jarPick(k) + '</button>'; }).join("") + '</div><div id="gfb" class="feedback" hidden></div>';
  } else if (nd.act === "order") {
    if (!G.order) G.order = { got: [], items: shuffle(nd.items.map(function (it, k) { return k; })) };
    box += '<ol class="ordered">' + nd.items.map(function (it, k) { const g = G.order.got[k]; return '<li class="' + (g != null ? "filled" : "") + '"><span>' + (k + 1) + '</span>' + (g != null ? esc(nd.items[g][0]) : "…") + '</li>'; }).join("") + '</ol>' +
      '<div class="order-pool">' + G.order.items.map(function (k) { return '<button class="tool' + (G.order.got.indexOf(k) >= 0 ? " used" : "") + '" data-gord="' + k + '"' + (G.order.got.indexOf(k) >= 0 ? " disabled" : "") + '>' + esc(nd.items[k][0]) + '</button>'; }).join("") + '</div><div id="gfb" class="feedback" hidden></div>';
  } else if (nd.act === "find") {
    box += '<div id="gfb" class="feedback" hidden></div>';
  } else if (nd.act === "lamp") {
    box += '<p class="hint">Chạm vào chiếc đèn treo trên trần để tắt đèn.</p>';
  } else if (nd.act === "predict") {
    box += '<div class="gopts">' + nd.opts.map(function (o, k) { return '<button class="opt" data-gpred="' + k + '"><kbd>' + (k + 1) + '</kbd><span>' + esc(o[0]) + '<small lang="vi">' + esc(o[1]) + '</small></span></button>'; }).join("") + '</div>';
  }
  const needsAct = nd.q || nd.act;
  box += '<div class="dlg-actions"><button class="tool" data-speak="' + esc(nd.en.replace(/[()]/g, "")) + '">' + ICON.play + '<span>Nghe</span></button>' +
    '<button class="tool' + (S.gameVi ? " on" : "") + '" data-gvi="1"><span class="flag">VI</span><span>Dịch</span></button>' +
    '<button class="btn primary small gnext" data-gnext="1"' + (needsAct ? " hidden" : "") + '>Tiếp ' + ICON.next + '</button></div></div>';

  const total = c.nodes.length;
  view.innerHTML = '<div class="rbar"><div class="rbar-in">' +
      '<button class="tool icon" data-gamehome="1" aria-label="Danh sách chương">' + ICON.back + '</button>' +
      '<div class="rbar-title"><b>Chương ' + (G.ci + 1) + '</b><span>' + c.t + '</span></div>' +
      '<div class="ghud"><span class="hearts" aria-label="' + G.hearts + ' tim">' + [0, 1, 2].map(function (k) { return '<i class="' + (k < G.hearts ? "on" : "") + '">' + HEART + '</i>'; }).join("") + '</span>' +
      '<span class="clues">' + ICON.key + G.clues + '</span>' + soundBtn() + '</div>' +
    '</div><div class="bar thin"><i style="width:' + (G.ni / total * 100) + '%"></i></div></div>' +
    '<div class="wrap game">' +
      '<div class="stage' + (dark ? " dark" : "") + '"><svg class="bg" viewBox="0 0 400 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' + BG[G.bg] + '</svg>' + castHtml + spots + '</div>' +
      box +
    '</div>';
}

function gFeedback(ok, msg, cont) {
  const fb = $("#gfb");
  if (!fb) return;
  fb.className = "feedback " + (ok ? "good" : "bad");
  fb.innerHTML = '<p class="fb-title">' + (ok ? "Manh mối +1" : "Mất 1 tim bình tĩnh") + '</p><p class="fb-word" lang="vi">' + msg + '</p>';
  fb.hidden = false;
  if (cont) { const b = $(".gnext"); if (b) b.hidden = false; }
  fb.scrollIntoView({ behavior: "smooth", block: "nearest" });
}
function gRight(msg) {
  G.clues++; G.answered = true; beep(true);
  updateHud();
  gFeedback(true, msg, true);
}
function gWrong(msg, btn) {
  G.hearts--; G.mistakes++; beep(false);
  if (btn) { btn.classList.add("wrong"); btn.disabled = true; }
  const nd = CHAPTERS[G.ci].nodes[G.ni];
  const actor = $(".actor.talk") || $(".actor");
  if (actor) { actor.classList.remove("shake"); void actor.offsetWidth; actor.classList.add("shake"); }
  updateHud();
  if (G.hearts <= 0) { setTimeout(gameOver, 700); gFeedback(false, msg, false); return; }
  gFeedback(false, msg + " Thử lại nhé.", false);
}
function updateHud() {
  const h = $(".hearts");
  if (h) h.innerHTML = [0, 1, 2].map(function (k) { return '<i class="' + (k < G.hearts ? "on" : "") + '">' + HEART + '</i>'; }).join("");
  const c = $(".clues"); if (c) c.innerHTML = ICON.key + G.clues;
}
function gameOver() {
  showModal('<div class="modal-jar">' + portrait("jack", "scared") + '</div><h2>Jack ngất xỉu!</h2><p>Hết tim bình tĩnh rồi. Đọc lại bản dịch hoặc tra từ, rồi chơi lại chương này nhé.</p>' +
    '<div class="modal-actions"><button class="btn primary" data-gstart="' + G.ci + '">Chơi lại chương</button><button class="btn" data-go="' + CHAPTERS[G.ci].p + '" data-mode="scene">Đọc lại truyện</button><button class="btn ghost" data-gamehome="1">Danh sách chương</button></div>');
}

function nextNode() {
  stopSpeak();
  const c = CHAPTERS[G.ci];
  G.order = null;
  if (G.ni < c.nodes.length - 1) { G.ni++; stepNode(); }
  else endChapter();
}
function endChapter() {
  const c = CHAPTERS[G.ci];
  const stars = G.hearts;
  S.game = S.game || {};
  const prev = S.game[c.id];
  if (!prev || stars > prev.stars) S.game[c.id] = { stars: stars, clues: G.clues };
  gameSave();
  const next = CHAPTERS[G.ci + 1];
  showModal('<div class="res-stars">' + [0, 1, 2].map(function (k) { return '<span class="st' + (k < stars ? " on" : "") + '" style="--d:' + (k * 0.15) + 's">' + ICON.star + '</span>'; }).join("") + '</div>' +
    '<h2>Xong chương ' + (G.ci + 1) + '!</h2><p>Bạn thu được <b>' + G.clues + ' manh mối</b> và còn <b>' + G.hearts + '/3 tim</b>.' + (next ? "" : " Bạn đã đi hết phần truyện hiện có. Hãy đọc phần kết để xem dự đoán của bạn có đúng không!") + '</p>' +
    '<div class="modal-actions">' + (next ? '<button class="btn primary" data-gstart="' + (G.ci + 1) + '">Chương ' + (G.ci + 2) + ': ' + next.t + '</button>' : '<button class="btn primary" data-quiz="p2">Làm thử thách từ vựng Phần 2</button>') +
    '<button class="btn" data-gstart="' + G.ci + '">Chơi lại để lấy đủ sao</button><button class="btn ghost" data-gamehome="1">Danh sách chương</button></div>');
}

document.addEventListener("click", function (e) {
  const t = e.target.closest("button");
  if (!t) return;
  const d = t.dataset;
  if (d.gamehome) { closeModal(); renderGameHome(); return; }
  if (d.gstart != null) { closeModal(); startChapter(+d.gstart); return; }
  if (!G) return;
  const nd = CHAPTERS[G.ci] && CHAPTERS[G.ci].nodes[G.ni];
  if (d.gnext) { nextNode(); return; }
  if (d.gvi) {
    S.gameVi = !S.gameVi; save();
    const v = $(".dlg-vi"); if (v) v.hidden = !S.gameVi;
    t.classList.toggle("on", !!S.gameVi);
    return;
  }
  if (!nd || G.answered) return;
  if (d.gopt != null) {
    const o = nd.opts[+d.gopt];
    if (o[1]) { t.classList.add("right"); document.querySelectorAll("[data-gopt]").forEach(function (b) { b.disabled = true; }); if (nd.who && nd.who !== "n") setFace(nd.who, "happy"); gRight(o[2]); }
    else gWrong(o[2], t);
    return;
  }
  if (d.gclock != null) {
    const k = +d.gclock;
    if (k === nd.ok) { t.classList.add("right"); document.querySelectorAll("[data-gclock]").forEach(function (b) { b.disabled = true; }); const tm = nd.times[k]; gRight("Đúng rồi: " + tm[0] + " giờ " + tm[1] + " phút."); }
    else { const tm = nd.times[k]; gWrong("Đồng hồ này chỉ " + tm[0] + " giờ " + (tm[1] || "đúng") + (tm[1] ? " phút" : "") + ". Kim dài (màu tím) chỉ phút.", t); }
    return;
  }
  if (d.gjar != null) {
    const k = +d.gjar;
    if (k === nd.ok) { t.classList.add("right"); document.querySelectorAll("[data-gjar]").forEach(function (b) { b.disabled = true; }); gRight("Đúng! Chiếc bình sứ Trung Quốc màu xanh, có hoa văn nổi (raised pattern)."); }
    else gWrong(k === 0 ? "Bình này màu đỏ, không phải bình xanh." : k === 1 ? "Màu xanh đúng rồi, nhưng bình này trơn, không có hoa văn nổi." : "Bình này màu xanh lá.", t);
    return;
  }
  if (d.gord != null) {
    const k = +d.gord;
    const pos = G.order.got.length;
    if (k === pos) {
      G.order.got.push(k); beep(true);
      t.disabled = true; t.classList.add("used");
      const li = document.querySelectorAll(".ordered li")[pos];
      li.classList.add("filled"); li.innerHTML = '<span>' + (pos + 1) + '</span>' + esc(nd.items[k][0]);
      if (G.order.got.length === nd.items.length) gRight("Chính xác cả lai lịch ngôi nhà! Nhà Turner rời đi đúng hai tháng trước, rồi giáo sư người Pháp và con gái đến.");
    } else gWrong("Chưa đúng thứ tự. Người thứ " + (pos + 1) + " là: " + nd.items[pos][1] + ".", null);
    return;
  }
  if (d.gspot != null) {
    const s = nd.spots[+d.gspot];
    G.solved[+d.gspot] = true; t.classList.add("seen");
    if (s.ok) { t.classList.add("found"); gRight(esc(s.vi)); const p = $(".dlg-en"); if (p) p.innerHTML = renderPara(s.en, CHAPTERS[G.ci].p); }
    else {
      const fb = $("#gfb"); fb.className = "feedback"; fb.innerHTML = '<p class="fb-word"><i>' + esc(s.en) + '</i> ' + esc(s.vi) + ' Tìm chỗ khác xem.</p>'; fb.hidden = false;
    }
    return;
  }
  if (d.glamp) {
    G.dark = true; G.answered = true;
    $(".stage").classList.add("dark");
    t.remove(); beep(true);
    const h = $(".hint"); if (h) h.textContent = "Đèn đã tắt. Căn phòng chìm vào bóng tối…";
    const b = $(".gnext"); if (b) b.hidden = false;
    return;
  }
  if (d.gpred != null) {
    G.answered = true;
    document.querySelectorAll("[data-gpred]").forEach(function (b) { b.disabled = true; });
    t.classList.add("right");
    const msgs = ["Một giả thuyết hợp lý: Lavington nói hồn ma muốn được “siêu thoát”.", "Có thể lắm: Lavington từng đoán chiếc bình có đáy giả.", "Một nghi ngờ sắc bén! Hãy nhớ: Felise chỉ mới đến đây 10 ngày, và chú George thì đang ở xa…"];
    const box = $(".dlg");
    const fb = document.createElement("div");
    fb.className = "feedback good";
    fb.innerHTML = '<p class="fb-title">Dự đoán đã ghi vào sổ thám tử</p><p class="fb-word" lang="vi">' + msgs[+d.gpred] + ' Đọc phần kết của truyện để biết đáp án nhé.</p>';
    box.insertBefore(fb, box.querySelector(".dlg-actions"));
    G.clues++; updateHud();
    const b = $(".gnext"); if (b) { b.hidden = false; b.innerHTML = "Kết thúc chương " + ICON.next; }
    return;
  }
});
function setFace(who, f) {
  G.faces[who] = f;
  const a = Array.prototype.find.call(document.querySelectorAll(".actor"), function (el) { return el.querySelector(".pt-" + who); });
  if (a) a.innerHTML = portrait(who, f);
}

document.addEventListener("keydown", function (e) {
  if (!G || !$(".game") || !$("#modal").hidden) return;
  const b = $(".gnext");
  if ((e.key === "ArrowRight" || e.key === "Enter") && b && !b.hidden && document.activeElement.tagName !== "BUTTON") { e.preventDefault(); nextNode(); return; }
  if (/^[1-4]$/.test(e.key)) { const o = $('[data-gopt="' + (+e.key - 1) + '"]') || $('[data-gclock="' + (+e.key - 1) + '"]') || $('[data-gjar="' + (+e.key - 1) + '"]') || $('[data-gpred="' + (+e.key - 1) + '"]'); if (o && !o.disabled) o.click(); }
});

renderHome();
</script>
